name: Leo Deploy Probe
on:
  workflow_run:
    workflows: ["Release Workflow", "Build"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
      contents: read
      pull-requests: write
    env:
      CLOUDFRONT_DISTRIBUTION_ID: simulated
      S3_BUCKET_NAME: simulated-bucket
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Triggering-run trust facts
        run: |
          echo "trigger_workflow=${{ github.event.workflow_run.name }}"
          echo "workflow_run.event=${{ github.event.workflow_run.event }}"
          echo "workflow_run.head_repository=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "PR_NUMBER=[$PR_NUMBER]"
          echo "pull_requests_len=$(jq -r '.workflow_run.pull_requests|length' "$GITHUB_EVENT_PATH")"
          echo "oidc_url_present=$([ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && echo yes || echo no)"
      - name: Download artifact (brave/leo deploy.yml inputs verbatim)
        uses: dawidd6/action-download-artifact@09f2f74827fd3a8607589e5ad7f9398816f540fe
        with:
          workflow_conclusion: success
          run_id: ${{ github.event.workflow_run.id }}
          name: build
          path: artifact
          allow_forks: false
      - name: Deploy (brave/leo shell logic verbatim, aws call simulated)
        env:
          AWS_REGION: us-west-2
        run: |
          shopt -s inherit_errexit
          set -xeEo pipefail
          cd ./artifact/storybook-static
          echo "--- content that would be published ---"
          cat index.html
          echo
          find . -type f
          if [[ -z ${PR_NUMBER} ]]; then
            echo "SIMULATED COMMAND: aws s3 sync . s3://${S3_BUCKET_NAME}/ --delete --exclude pr-*/* --exclude *.old.css --exclude *.diff"
          else
            echo "SIMULATED COMMAND: aws s3 sync . s3://${S3_BUCKET_NAME}/pr-${PR_NUMBER}/commit-${HEAD_SHA}/ --delete"
          fi
